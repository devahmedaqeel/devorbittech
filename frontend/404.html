<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="apple-touch-icon" href="/images/logo.jpg" />

  <meta name="theme-color" content="#050a14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 650px;
    }
    .code {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(5rem, 12vw, 7.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, #00f0ff, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);

      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 1.15rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .links-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 2.5rem;
    }
    .nav-pill {
      display: inline-block;
      padding: 8px 18px;
      background: rgba(9, 23, 51, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: #00f0ff;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .nav-pill:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: #00f0ff;
      transform: translateY(-2px);
    }
    .btn {
      display: inline-block;
      padding: 0.9rem 2.5rem;
      background: linear-gradient(135deg, #007aff, #00f0ff);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      border-radius: 50px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.35);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(0, 240, 255, 0.55);
    }

  <div class="container">

    <p>The requested route or resource could not be found. Explore our primary portals below or return to the main platform.</p>
    
    <div class="links-box">
      <a href="/" class="nav-pill">Home</a>
      <a href="/about" class="nav-pill">About</a>
      <a href="/#services" class="nav-pill">Services</a>
      <a href="/case-studies" class="nav-pill">Case Studies</a>
      <a href="/blog" class="nav-pill">Blog</a>
      <a href="/#contact" class="nav-pill">Contact</a>
    </div>
